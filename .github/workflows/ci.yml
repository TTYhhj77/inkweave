name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Check & build Svelte UI
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run Go tests
        run: go test -v -race ./...

      - name: Verify PC and gomobile Go builds
        run: |
          go build -o bin/inkweave ./cmd/inkweave
          go build ./mobile/gomobile
